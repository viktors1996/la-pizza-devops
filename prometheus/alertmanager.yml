global:
  resolve_timeout: 5m

route:
  group_by: ['alertname']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  receiver: 'telegram'

receivers:
  - name: 'telegram'
    telegram_configs:
      - bot_token: 'ТВОЙ_ТОКЕН_ОТ_BOTFATHER'
        chat_id: 5384440806
        parse_mode: 'HTML'
        send_resolved: true
        message: |
          {{ if eq .Status "firing" }}🚨 <b>FIRING: {{ .CommonLabels.alertname }}</b>{{ else }}✅ <b>RESOLVED: {{ .CommonLabels.alertname }}</b>{{ end }}

          📌 <b>Описание:</b> {{ .CommonAnnotations.description }}