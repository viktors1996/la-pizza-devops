global:
  scrape_interval: 15s

# Подключаем файл с правилами алертов
rule_files:
  - "alert.rules.yml"

# Подключаем Alertmanager
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'pizza_backend'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['backend:5000']

  - job_name: 'node_exporter'
    static_configs:
      - targets: ['node_exporter:9100']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']